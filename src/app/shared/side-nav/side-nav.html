<h1>Sistema de Becas Alimentarias</h1>

<mat-nav-list>
  @for (item of visibleItems(); track item.route + item.title) {
    <app-menu-item [title]="item.title" [icon]="item.icon" [route]="item.route" [subItems]="item.subItems" />
  }
</mat-nav-list>

<footer class="side-nav-footer">
  <mat-nav-list>
    <button type="button" mat-list-item class="logout" (click)="logout()">
      <mat-icon matListItemIcon aria-hidden="true">logout</mat-icon>
      <span matListItemTitle>Cerrar sesión</span>
    </button>
  </mat-nav-list>
</footer>
