<nav class="flex" aria-label="Ruta de navegacion">
  <ol class="flex items-center">
    @for (
      breadcrumb of breadcrumbs();
      track breadcrumb.url + breadcrumb.label;
      let i = $index;
      let isLastItem = $last
    ) {
      <li class="flex items-center">
        @if (i > 0) {
          <svg
            class="w-4 h-4 mx-2 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        }

        @if (!isLastItem) {
          <a
            [routerLink]="breadcrumb.url"
            class="text-gray-600 font-medium text-sm transition-colors duration-200 no-underline"
          >
            {{ breadcrumb.label }}
          </a>
        } @else {
          <span class="font-medium text-sm" aria-current="page">
            {{ breadcrumb.label }}
          </span>
        }
      </li>
    }
  </ol>
</nav>
