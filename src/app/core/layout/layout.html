<mat-drawer-container class="main-container" autosize fullscreen>
  <mat-drawer
    #drawer
    id="app-layout-sidenav"
    class="sidenav"
    mode="side"
    opened
    aria-label="Menú de navegación lateral"
  >
    <app-side-nav [activeSection]="activeSection()" />
  </mat-drawer>

  <main class="main-content" [class.drawer-open]="drawer.opened">
    <header>
      <mat-toolbar color="primary">
        <mat-toolbar-row class="toolbar-row">
          <button
            type="button"
            mat-icon-button
            aria-controls="app-layout-sidenav"
            [attr.aria-expanded]="drawer.opened"
            aria-label="Abrir o cerrar el menú lateral"
            (click)="drawer.toggle()"
          >
            <mat-icon aria-hidden="true">menu</mat-icon>
          </button>
          <span class="toolbar-spacer hide-on-mobile-open" aria-hidden="true"></span>
          <div class="toolbar-actions hide-on-mobile-open" role="group" aria-label="Acciones de la barra superior">
            <nav class="toolbar-actions-links" aria-label="Secciones de la aplicación">
              @for (section of toolbarSections; track section.id) {
                <button
                  type="button"
                  class="toolbar-section-link"
                  [class.active]="activeSection() === section.id"
                  [attr.aria-current]="activeSection() === section.id ? 'page' : null"
                  (click)="setSection(section.id)"
                >
                  <mat-icon aria-hidden="true">{{ section.icon }}</mat-icon>
                  {{ section.label }}
                </button>
              }
            </nav>

            <app-notification-dropdown [notifications]="notifications()" (viewAll)="allNotifications()" />
            <app-theme-toggle />

            <button type="button" mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Mi perfil">
              <mat-icon aria-hidden="true">account_circle</mat-icon>
            </button>
            <mat-menu #userMenu="matMenu">
              <button mat-menu-item (click)="goToProfile()">
                <mat-icon aria-hidden="true">person</mat-icon>
                <span>Mi perfil</span>
              </button>
            </mat-menu>
          </div>
        </mat-toolbar-row>
      </mat-toolbar>
    </header>

    <section class="page-content hide-on-mobile-open" aria-label="Contenido principal">
      <app-breadcrumb />
      <router-outlet />
    </section>
  </main>
</mat-drawer-container>

@if (isLoading()) {
  <app-loading />
}
